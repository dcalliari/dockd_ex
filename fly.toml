# fly.toml app configuration file generated for dockd-ex on 2026-10-01T20:14:49Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dockd-ex'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = '/app/bin/migrate'

[env]
  ECTO_SSL = 'true'
  PHX_HOST = 'dockd-ex.fly.dev'
  PHX_SERVER = 'true'
  POOL_SIZE = '5'
  PORT = '4000'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['app']
