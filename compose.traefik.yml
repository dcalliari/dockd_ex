services:
  db:
    profiles: [local-db]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dockd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dockd}
      POSTGRES_DB: ${POSTGRES_DB:-dockd_prod}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dockd} -d ${POSTGRES_DB:-dockd_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [shared]
    volumes:
      - dockd_traefik_db_data:/var/lib/postgresql/data
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MIX_ENV: prod
      PHX_HOST: ${PHX_HOST:?set PHX_HOST}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE}
      PHX_SERVER: "true"
    command: sh -c "bin/migrate && exec bin/dockd start"
    networks: [shared]
    labels:
      traefik.enable: "true"
      traefik.http.routers.dockd.rule: "Host(`${PHX_HOST}`)"
      traefik.http.routers.dockd.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.dockd.tls: "true"
      traefik.http.services.dockd.loadbalancer.server.port: "4000"
volumes:
  dockd_traefik_db_data:
networks:
  shared:
    external: true
    name: ${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK}
