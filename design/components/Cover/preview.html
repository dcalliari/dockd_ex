<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Dockd</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:640px; height:288px; }
  .brand { fill:var(--red); }
  .deep { fill:var(--ink); }
  .tint { fill:var(--surface-sunken); }
  .tile { rx:6px; }
  .slab { rx:6px; }
  .words { position:absolute; left:24px; bottom:24px; max-width:440px; }
  .name { margin:0; font-size:96px; line-height:.9; font-weight:900; font-stretch:125%; letter-spacing:-0.03em; color:var(--ink); }
  .name i { font-style:normal; color:var(--red); }
  .tag { margin:8px 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 640 288" width="640" height="288">
<!--
  blocks      red 176x264 bled off the top (the brand slab) · ink as one merged 3:4 tile 108x144 · surface-sunken as the relief tiles — about 40% of 960x288
  arrangement one tall red slab at the left of the box, then a poster wall of 3:4 tiles marching off the right edge, bottoms aligned space-6 above the edge
  pattern     tiles cut by radius-md in the 3:4 cover ratio, some merged two-wide, from "a capa é o conteúdo": the grid of covers IS the interface
  scales      tile 48x64 (3:4), pitch space-3 gaps (60 by 76), slab width 176 = 11 x space-4, corners radius-md 6px
-->
<rect class="brand slab" x="0" y="-24" width="176" height="264"/>
<rect class="deep tile" x="192" y="24" width="108" height="144"/>
<rect class="tint tile" x="312" y="24" width="48" height="64"/>
<rect class="deep tile" x="372" y="24" width="48" height="64"/>
<rect class="tint tile" x="432" y="24" width="48" height="64"/>
<rect class="tint tile" x="492" y="24" width="48" height="64"/>
<rect class="deep tile" x="552" y="24" width="48" height="64"/>
<rect class="tint tile" x="612" y="24" width="48" height="64"/>
<rect class="tint tile" x="312" y="100" width="48" height="64"/>
<rect class="tint tile" x="372" y="100" width="48" height="64"/>
<rect class="brand tile" x="432" y="100" width="48" height="64"/>
<rect class="tint tile" x="492" y="100" width="48" height="64"/>
<rect class="tint tile" x="552" y="100" width="48" height="64"/>
<rect class="deep tile" x="612" y="100" width="48" height="64"/>
<rect class="tint tile" x="192" y="176" width="48" height="64"/>
<rect class="deep tile" x="252" y="176" width="48" height="64"/>
<rect class="tint tile" x="312" y="176" width="48" height="64"/>
<rect class="tint tile" x="372" y="176" width="48" height="64"/>
<rect class="tint tile" x="432" y="176" width="48" height="64"/>
<rect class="deep tile" x="492" y="176" width="108" height="64"/>
<rect class="tint tile" x="612" y="176" width="48" height="64"/>
</svg>
</div>
<div class="words">
<h1 class="name">dockd<i>.</i></h1>
<p class="tag">Biblioteca e fila de compra para Switch e Switch 2.</p>
</div>
</div>
</body>
</html>
