<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>StatusControl</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;display=swap"></head>
<body><div class="dk-preview">
<div class="dk-stack" style="align-items:flex-start;gap:var(--space-5)">
<div class="dk-status-control">
<button class="dk-status-control__button" type="button" aria-haspopup="menu" aria-expanded="true"><span class="dk-status dk-status--jogando">Jogando</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg></button>
<ul class="dk-status-control__menu" role="menu">
<li><button type="button" role="menuitemradio" aria-checked="false"><span class="dk-status dk-status--quero">Quero</span>Quero</button></li>
<li><button type="button" role="menuitemradio" aria-checked="false"><span class="dk-status dk-status--backlog">Backlog</span>Backlog</button></li>
<li><button type="button" role="menuitemradio" aria-checked="true"><span class="dk-status dk-status--jogando">Jogando</span>Jogando</button></li>
<li><button type="button" role="menuitemradio" aria-checked="false"><span class="dk-status dk-status--zerado">Zerado</span>Zerado</button></li>
<li><button type="button" role="menuitemradio" aria-checked="false"><span class="dk-status dk-status--larguei">Larguei</span>Larguei</button></li>
</ul>
</div>
<div class="dk-status-control"><button class="dk-status-control__button" type="button" aria-haspopup="menu" aria-expanded="false"><span class="dk-status dk-status--quero">Quero</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg></button></div>
<div class="dk-status-control"><button class="dk-status-control__button" type="button" aria-haspopup="menu" aria-expanded="false"><span class="dk-status dk-status--backlog">Backlog</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg></button></div>
</div>
</div></body>
</html>
