<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>StatusControl</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;display=swap"></head>
<body><div class="dk-preview">
<div style="display:flex;flex-direction:column;gap:var(--space-5)">
<div class="dk-status-control">
<button type="button" class="dk-status dk-status--jogando" aria-haspopup="true" aria-expanded="false">Jogando</button>
<span class="dk-status-control__since">desde 22/09/2026</span>
<div class="dk-status-control__options" role="group" aria-label="Mudar status"><button type="button" class="dk-status dk-status--quero">Quero</button><button type="button" class="dk-status dk-status--backlog">Backlog</button><button type="button" class="dk-status dk-status--zerado">Zerado</button><button type="button" class="dk-status dk-status--larguei">Larguei</button></div>
</div>
<div class="dk-status-control is-open">
<button type="button" class="dk-status dk-status--quero" aria-haspopup="true" aria-expanded="true">Quero</button>
<span class="dk-status-control__since">desde 14/09/2026</span>
<div class="dk-status-control__options" role="group" aria-label="Mudar status"><button type="button" class="dk-status dk-status--backlog">Backlog</button><button type="button" class="dk-status dk-status--jogando">Jogando</button><button type="button" class="dk-status dk-status--zerado">Zerado</button><button type="button" class="dk-status dk-status--larguei">Larguei</button></div>
</div>
</div>
<script>
document.querySelectorAll('.dk-status-control').forEach(function (t) {
  var cur = t.querySelector(':scope > .dk-status');
  t.querySelector('.dk-status-control__options').style.paddingLeft = (cur.offsetWidth + 8) + 'px';
  cur.addEventListener('click', function () { var o = t.classList.toggle('is-open'); cur.setAttribute('aria-expanded', o); });
});
</script>
</div></body>
</html>
