<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>StatusChip</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;display=swap"></head>
<body><div class="dk-preview">
<div class="dk-stack" style="margin-bottom:var(--space-3)"><span class="dk-status dk-status--quero">Quero</span><span class="dk-status dk-status--backlog">Backlog</span><span class="dk-status dk-status--jogando">Jogando</span><span class="dk-status dk-status--zerado">Zerado</span><span class="dk-status dk-status--larguei">Larguei</span></div>
<div class="dk-stack" style="margin-bottom:var(--space-4)"><span class="dk-status dk-status--quero dk-status--sm">Quero</span><span class="dk-status dk-status--backlog dk-status--sm">Backlog</span><span class="dk-status dk-status--jogando dk-status--sm">Jogando</span><span class="dk-status dk-status--zerado dk-status--sm">Zerado</span><span class="dk-status dk-status--larguei dk-status--sm">Larguei</span></div>
<div class="dk-stack" style="align-items:flex-start">
<span class="dk-poster" style="width:120px"><img src="/_blob/16e8b2ffa2cff71f63ae1bd0aa57a874" alt=""><span class="dk-status dk-status--quero dk-status--sm dk-poster__status">Quero</span></span>
<span class="dk-poster" style="width:120px"><img src="/_blob/0b19019ce1d6c47ae4ed25282af23675" alt=""><span class="dk-status dk-status--jogando dk-status--sm dk-poster__status">Jogando</span></span>
<span class="dk-poster dk-poster--faded" style="width:120px"><img src="/_blob/da285b828257d9b6dc69f74836b724e3" alt=""><span class="dk-status dk-status--zerado dk-status--sm dk-poster__status">Zerado</span></span>
<span class="dk-poster dk-poster--faded" style="width:120px"><img src="/_blob/12031472ef4b16c3a95cda5dcdca74b1" alt=""><span class="dk-status dk-status--larguei dk-status--sm dk-poster__status">Larguei</span></span>
</div>
</div></body>
</html>
