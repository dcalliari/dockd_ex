name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dockd
          POSTGRES_PASSWORD: dockd
          POSTGRES_DB: dockd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dockd -d dockd_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIX_ENV: test
      DOCKD_DB_PASSWORD: dockd
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.18.3
          otp-version: 27.3.4.3
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: beam-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: beam-${{ runner.os }}-
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dockd:ci
