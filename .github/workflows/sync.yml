name: Sync

# The Fly machine stops when idle, so a daily sync inside the app would die halfway
# (fly.toml sets CATALOG_SYNC_SCHEDULER=false). Once a day this starts a one-off
# machine from the deployed image, runs Dockd.Release.sync() and destroys it.
on:
  schedule:
    - cron: "17 9 * * *" # 06:17 em Brasília
  workflow_dispatch:

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: dockd-ex
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Run the sync in a one-off machine
        run: |
          set -euo pipefail
          # The image of the latest release, not `flyctl image show`: that one reports a
          # machine's image, which is the old one while a sync or a stopped app lags behind.
          image=$(flyctl releases -a "$APP" --image --json | jq -r '.[0].ImageRef')
          name="catalog-sync-${GITHUB_RUN_ID}"

          flyctl machine run "$image" bin/dockd eval 'Dockd.Release.sync()' \
            -a "$APP" --name "$name" --region gru --vm-size shared-cpu-1x --vm-memory 1024 \
            --restart no --autostart=false --skip-dns-registration --detach \
            -e ECTO_SSL=true -e POOL_SIZE=2

          machine() { flyctl machine list -a "$APP" --json | jq --arg name "$name" '.[] | select(.name == $name)'; }
          id=$(machine | jq -r .id)
          trap 'flyctl machine destroy "$id" -a "$APP" --force >/dev/null || true' EXIT

          # The Machines API caps each wait at about a minute, so one long
          # `flyctl machine wait` gives up early; poll until it stops instead.
          deadline=$((SECONDS + 250 * 60))
          # A failed listing (the API drops the odd connection) is not a stopped machine.
          until [ "$(machine 2>/dev/null | jq -r .state 2>/dev/null || true)" = stopped ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "sync did not finish in 250 minutes"
              exit 1
            fi
            sleep 30
          done

          flyctl logs -a "$APP" --machine "$id" --no-tail || true
          code=$(machine | jq -r '[.events[]? | select(.type == "exit") | .request.exit_event.exit_code] | first // "unknown"')
          echo "exit code: $code"
          test "$code" = "0"
