name: Sync

# The Fly machine stops when idle, so a daily sync inside the app would die halfway
# (fly.toml sets CATALOG_SYNC_SCHEDULER=false). Once a day this starts a one-off
# machine from the deployed image, runs Dockd.Release.sync() and destroys it.
on:
  schedule:
    - cron: "17 9 * * *" # 06:17 em Brasília
  workflow_dispatch:

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: dockd-ex
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Run the sync in a one-off machine
        run: |
          set -euo pipefail
          image=$(flyctl image show -a "$APP" --json | jq -r '.[0] | "\(.Registry)/\(.Repository):\(.Tag)"')
          name="catalog-sync-${GITHUB_RUN_ID}"

          flyctl machine run "$image" bin/dockd eval 'Dockd.Release.sync()' \
            -a "$APP" --name "$name" --region gru --vm-size shared-cpu-1x --vm-memory 1024 \
            --restart no --autostart=false --skip-dns-registration --detach \
            -e ECTO_SSL=true -e POOL_SIZE=2

          id=$(flyctl machine list -a "$APP" --json | jq -r --arg name "$name" '.[] | select(.name == $name) | .id')
          trap 'flyctl machine destroy "$id" -a "$APP" --force >/dev/null || true' EXIT

          flyctl machine wait "$id" -a "$APP" --state stopped --wait-timeout 110m
          flyctl logs -a "$APP" --machine "$id" --no-tail || true

          code=$(flyctl machine status "$id" -a "$APP" --display-config --json 2>/dev/null \
            | jq -r '[.events[]? | select(.type == "exit") | .request.exit_event.exit_code] | first // empty' || true)
          echo "exit code: ${code:-unknown}"
          test "${code:-0}" = "0"
